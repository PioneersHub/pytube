# BASIC CONFIGURATION - DO NOT ALTER
# Put your configuration in `config.local.yaml`
# ########################################
# VIMEO
# ########################################
---
vimeo:
  client_id: ""
  client_secret: ""
  access_token: ""
  # Raw long-stream sources for the auto-cutter (stage 1 of raw -> auto-cut).
  # Populate accounts in config_local.yaml. Each account selects videos by
  # folder_id OR title_contains OR title_regex (exactly one).
  # Files are saved with their Vimeo title as filename so that
  # src/video_processor/process_talk_list.py can still match them.
  raw_sources:
    accounts: []                      # populated by the user in config_local.yaml
    download:
      output_dir: ""                  # should equal src/video_processor/config.yaml input.folder
      quality: "best"                 # best | 1080p | 720p | 480p
      max_concurrent: 2               # per-account concurrent video downloads
      max_accounts_concurrent: 1      # concurrent accounts; default 1 = serial, set >1 to parallelize
      retry_max_attempts: 3           # retry count on transient download failures (0 = no retry)
      skip_existing: true
# ########################################
# ########################################
dirs:
  work_dir: "._tmp"
  video_dir: "./_tmp/videos"
# ########################################
# # GOOGLE SHEETS
# ########################################
spreadsheets:
  # Google Spreadsheet mapping room: id
  ids:
    room: "google-id"
  # Google Sheet names as a list
  sheets:
    - "Sheet 1"
# ########################################
# Pretalx
# For API credentials, use the standard pytanis setup:
# Follow the pytanis documentation to configure ~/.pytanis/credentials
pretalx:
  event_slug: "pyconde-pydata-2026"
  # Path to the confirmed-sessions CSV export from Pretalx. Consumed by
  # src/video_processor/process_talk_list.py to build the session->recording
  # Parquet that the auto-cutter reads. Required for that stage; leave empty
  # if you don't use the auto-cut pipeline.
  sessions_csv: ""
  # Path where `pytube video map-recordings` writes the filename -> {room, day,
  # period} YAML. Hand-edit to fix typos or classify filenames the scanner
  # couldn't parse. process_talk_list.py reads this to pair sessions with raw
  # recordings.
  recording_mapping_yaml: ""
  # Videos need to be split between the PyCon DE and PyData YouTube channels
  video_to_track:
    CODE: "Track"
  # identify the channel by track name or snippet
  track_to_channel:
    pycon: "pycon"
    pydata: "pydata"
  questions_map:
    # attribute: id
    # attributes must exist in SpeakerInfo data class
    some_attribute: 0
# ########################################
# Claude API for heuristic matching
claude:
  prompt: |
    You are an assistant that decides whether a conference talk should be on the **PyCon DE** channel or the **PyData** channel, based on its title and abstract.

    **PyCon DE (Python Conference DE)** sessions cover Python software engineering topics: Python development, DevOps/MLOps in Python, updates in the Python language and libraries, web development (e.g. Django), testing, security, community, and general programming use-cases in Python.

    **PyData** sessions cover data-centric topics: data science, analytics, machine learning, deep learning, artificial intelligence, visualization, and related tools or business use-cases in these areas (using Python).

    **Task:** Read the talk title and abstract below. Decide which category the talk falls into (PyCon DE or PyData) based on its content focus, *then output only the single category name* (exactly "PyCon DE" or "PyData") with no additional text.

    Title: {title}
    Abstract: {abstract}
# ########################################
# Event
event:
  name: "PyCon DE & PyData 2026"
  url: "https://2026.pycon.de"
  program_url: "https://2026.pycon.de/program/"
  # 24-hour. Sessions before this hour are classified Morning, on/after Afternoon.
  lunch_break_cut: 13
# ########################################
# Local path to content images
session_images: ""
# ########################################
# ########################################
# YouTube
# ########################################
youtube:
  client_secrets_file: "~/code/pioneershub/py_tube/_secret/client_secrets.json"
  api_key: ""
  max_description_length: 5000
  token_path: "~/code/pioneershub/py_tube/_secret/youtube_token.json"
# ########################################
# Social Media Configuration
# For API setup instructions, see: docs/api-credentials.md
# ########################################

# Active social media service - options: LinkedIn, twitter, mastodon, bluesky
social_media_service: "linkedin"

# LinkedIn
linkedin:
  # path to save yaml files to for posting on LinkedIn with comments
  influent_path: ''

# Twitter/X Configuration
twitter:
  api_key: ""
  api_secret: ""
  access_token: ""
  access_token_secret: ""
  bearer_token: ""

# Mastodon Configuration
mastodon:
  instance_url: "https://mastodon.social"  # Your Mastodon instance
  access_token: ""
  visibility: "public"  # public, unlisted, private, direct

# Bluesky Configuration
bluesky:
  handle: ""  # e.g., "user.bsky.social"
  app_password: ""  # Use app-specific password
  
# ########################################
# # Prompts for descriptions
prompts:
  teaser: >
    You are a professional content editor. Write a single, engaging teaser sentence that encourages people to watch a speaker’s presentation from PyCon DE & PyData 2025.
    Focus on the speaker and the topic of their talk. Use a concise and professional tone tailored for LinkedIn.
    Start the sentence with “Watch” and make it sound relevant and insightful. Keep it short and impactful.

  description: >
    You are a professional editor creating LinkedIn descriptions for speaker presentations from PyCon DE & PyData 2025.
    Write a continuous, informative paragraph (around {max_tokens} tokens) that describes the speaker’s talk.
    Keep the tone professional, concise, and relevant to a tech audience.
    Mention the speaker’s full name, job title, and company if available. After the full name, refer to the speaker by first name only.
    Avoid the verb “delve.”
    Focus on what the talk is about, why it matters, and what viewers can learn. Make sure the presentation is the clear focus of the text.
# ########################################
# AI Service Configuration
# Configure your preferred AI service in config_local.yaml
# For setup instructions, see: docs/api-credentials.md
# Quick start guide: docs/quick-setup-services.md
# ########################################

# Active AI service - options: openai, anthropic, google, cohere
ai_service: "openai"

# OpenAI Configuration
openai:
  api_key: ""
  # Models: gpt-4, gpt-4-turbo, gpt-3.5-turbo, gpt-4o, gpt-4o-mini
  model: "gpt-3.5-turbo"
  # Temperature settings for different tasks
  temperature:
    teaser: 0.7
    description: 0.9
  # Optional: Organization ID
  organization: ""

# Anthropic Claude Configuration
anthropic:
  api_key: ""
  # Models: claude-3-opus-20240229, claude-3-sonnet-20240229, claude-3-haiku-20240307
  model: "claude-3-sonnet-20240229"
  temperature:
    teaser: 0.7
    description: 0.9
  # Max tokens for Claude (different from OpenAI)
  max_tokens: 1000

# Google Gemini Configuration
google:
  api_key: ""
  # Models: gemini-pro, gemini-pro-vision
  model: "gemini-pro"
  temperature:
    teaser: 0.7
    description: 0.9
  # Safety settings
  safety_settings:
    harassment: "BLOCK_MEDIUM_AND_ABOVE"
    hate_speech: "BLOCK_MEDIUM_AND_ABOVE"

# Cohere Configuration
cohere:
  api_key: ""
  # Models: command, command-light, command-nightly
  model: "command"
  temperature:
    teaser: 0.7
    description: 0.9

# ########################################