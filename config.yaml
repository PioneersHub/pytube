# BASIC CONFIGURATION - DO NOT ALTER
# Put your configuration in `config.local.yaml`
# ########################################
# VIMEO
# ########################################
---
vimeo:
  client_id: ""
  client_secret: ""
  access_token: ""
  # Raw long-stream sources for the auto-cutter (stage 1 of raw -> auto-cut).
  # Populate accounts in config_local.yaml. Each account selects videos by
  # folder_id OR title_contains OR title_regex (exactly one).
  # Files are saved with their Vimeo title as filename so that
  # src/video_processor/process_talk_list.py can still match them.
  raw_sources:
    accounts: []                      # populated by the user in config_local.yaml
    download:
      output_dir: ""                  # should equal src/video_processor/config.yaml input.folder
      quality: "best"                 # best | 1080p | 720p | 480p
      max_concurrent: 2               # per-account concurrent video downloads
      max_accounts_concurrent: 1      # concurrent accounts; default 1 = serial, set >1 to parallelize
      retry_max_attempts: 3           # retry count on transient download failures (0 = no retry)
      skip_existing: true
# ########################################
# ########################################
dirs:
  # Root for all project data. Each event lives in projects/<slug>/, holding its
  # own config.yaml, records, videos and the YouTube description template.
  work_dir: "projects"
  # Video files of the active event. Event-specific — override this in
  # projects/<slug>/config.yaml, not here.
  video_dir: "projects/videos"
# ########################################
# # GOOGLE SHEETS
# ########################################
spreadsheets:
  # Google Spreadsheet mapping room: id
  ids:
    room: "google-id"
  # Google Sheet names as a list
  sheets:
    - "Sheet 1"
# ########################################
# Pretalx
# For API credentials, use the standard pytanis setup:
# Follow the pytanis documentation to configure ~/.pytanis/credentials
pretalx:
  event_slug: "pyconde-pydata-2026"
  # Path to the confirmed-sessions CSV export from Pretalx. Consumed by
  # src/video_processor/process_talk_list.py to build the session->recording
  # Parquet that the auto-cutter reads. Required for that stage; leave empty
  # if you don't use the auto-cut pipeline.
  sessions_csv: ""
  # Path where `pytube video map-recordings` writes the filename -> {room, day,
  # period} YAML. Hand-edit to fix typos or classify filenames the scanner
  # couldn't parse. process_talk_list.py reads this to pair sessions with raw
  # recordings.
  recording_mapping_yaml: ""
  # Path where process_talk_list.py writes the Pretalx Room -> short-form
  # mapping YAML (default transform: strip [brackets], strip, lowercase).
  # Hand-edit values to override the default short form per room.
  room_mapping_yaml: "/Volumes/DATA4T/2026/pyconde-pydata-2026_room_mapping.yaml"
  # Videos need to be split between the PyCon DE and PyData YouTube channels
  # Videos need to be split between the PyCon DE and PyData YouTube channels.
  # Define the real mapping in projects/<slug>/config.yaml, for example:
  #   video_to_track:
  #     3C9P9V: pyconde
  #     AF9DNH: pydata
  #     7YA98N: no_publishing
  # Keep this empty: a placeholder entry here would merge into the real mapping.
  video_to_track: {}
  # identify the channel by track name or snippet
  track_to_channel:
    pycon: "pycon"
    pydata: "pydata"
  questions_map:
    # attribute: id
    # attributes must exist in SpeakerInfo data class
    some_attribute: 0
# ########################################
# Claude API for heuristic matching
claude:
  prompt: |
    You are an assistant that decides whether a conference talk should be on the **PyCon DE** channel or the **PyData** channel, based on its title and abstract.

    **PyCon DE (Python Conference DE)** sessions cover Python software engineering topics: Python development, DevOps/MLOps in Python, updates in the Python language and libraries, web development (e.g. Django), testing, security, community, and general programming use-cases in Python.

    **PyData** sessions cover data-centric topics: data science, analytics, machine learning, deep learning, artificial intelligence, visualization, and related tools or business use-cases in these areas (using Python).

    **Task:** Read the talk title and abstract below. Decide which category the talk falls into (PyCon DE or PyData) based on its content focus, *then output only the single category name* (exactly "PyCon DE" or "PyData") with no additional text.

    Title: {title}
    Abstract: {abstract}
# ########################################
# Event
event:
  name: "PyCon DE & PyData 2026"
  url: "https://2026.pycon.de"
  program_url: "https://2026.pycon.de/program/"
  # 24-hour. Sessions before this hour are classified Morning, on/after Afternoon.
  lunch_break_cut: 13
# ########################################
# Local path to content images
session_images: ""
# ########################################
# ########################################
# YouTube
# ########################################
youtube:
  client_secrets_file: "~/code/pioneershub/py_tube/_secret/client_secrets.json"
  api_key: ""
  # Longest description YouTube accepts; longer texts fall back to sm_short_text.
  max_description_length: 5000
  # Where the OAuth token is cached after the first browser authorization.
  # Fallback only — prefer a per-channel token_path (see channels below), because
  # channels usually belong to different Google accounts and a shared file means
  # authorizing one channel destroys the other channel's credentials.
  token_path: "~/code/pioneershub/py_tube/_secret/youtube_token.json"
  # REQUIRED — configuration is rejected without at least one channel.
  # The key is the channel token: it must match the values used in
  # pretalx.video_to_track / track_to_channel and becomes the upload directory
  # name under dirs.video_dir. `do_not_release` is reserved and must not be used.
  # Define the real ids in config_local.yaml, for example:
  # channels:
  #   pyconde:
  #     id: "UC..."                                # YouTube channel id
  #     playlist_id: "PL..."                       # hidden staging playlist
  #     token_path: ".secrets/token_pyconde.json"  # own OAuth token for this channel
  #   pydata:
  #     id: "UC..."
  #     playlist_id: "PL..."
  #     token_path: ".secrets/token_pydata.json"
  channels: {}
# ########################################
# Social Media Configuration
# For API setup instructions, see: docs/api-credentials.md
# ########################################

# Active social media service - options: LinkedIn, twitter, mastodon, bluesky
social_media_service: "linkedin"

# LinkedIn
linkedin:
  # path to save yaml files to for posting on LinkedIn with comments
  influent_path: ''

# Twitter/X Configuration
twitter:
  api_key: ""
  api_secret: ""
  access_token: ""
  access_token_secret: ""
  bearer_token: ""

# Mastodon Configuration
mastodon:
  instance_url: "https://mastodon.social"  # Your Mastodon instance
  access_token: ""
  visibility: "public"  # public, unlisted, private, direct

# Bluesky Configuration
bluesky:
  handle: ""  # e.g., "user.bsky.social"
  app_password: ""  # Use app-specific password
  
# ########################################
# Transcripts (optional): if a talk transcript is available, generate the
# description from it instead of the abstract. Layout: one folder per talk named
# with the 6-char Pretalx code, containing `transcript.md`.
transcripts:
  dir: ""            # root folder; empty => feature disabled
  max_chars: 48000   # truncate very long transcripts before summarizing
# ########################################
# AI Service Configuration — SINGLE source of truth.
# Everything AI lives under `ai_service:`: the active provider, its per-provider
# credentials/params, and the generation prompts. Put secrets in config_local.yaml.
# For setup instructions, see: docs/api-credentials.md
# ########################################
ai_service:
  # Active provider. Options: openai, anthropic,
  # mlx (local OpenAI-compatible server), claude_code (local Claude Code CLI).
  provider: "openai"

  # Generation prompts (provider-independent)
  prompts:
    teaser: >
      You are a professional content editor. Write a single, engaging teaser sentence that encourages people to watch a speaker’s presentation from PyCon DE & PyData 2026.
      Focus on the speaker and the topic of their talk. Use a concise and professional tone tailored for LinkedIn.
      Start the sentence with “Watch” and make it sound relevant and insightful. Keep it short and impactful.

    description: >
      You are a professional editor creating LinkedIn descriptions for speaker presentations from PyCon DE & PyData 2026.
      Write a continuous, informative paragraph (around {max_tokens} tokens) that describes the speaker’s talk.
      Keep the tone professional, concise, and relevant to a tech audience.
      Mention the speaker’s full name, job title, and company if available. After the full name, refer to the speaker by first name only.
      Avoid the verb “delve.”
      Focus on what the talk is about, why it matters, and what viewers can learn. Make sure the presentation is the clear focus of the text.

    # Used ONLY when a transcript is available for the talk (see `transcripts:` above).
    # Produces the YouTube description from the actual talk content.
    description_from_transcript: >
      You are a senior technical editor. Using the talk transcript below, write a summary of the subject
      matter itself, in excellent English: technically precise yet easy to follow, in a neutral, factual
      voice. Prefer active voice and concrete specifics — name the actual techniques, tools and measured
      numbers rather than describing them in general terms.

      Write about the topic, never about the presentation or the presenter. Do not mention the speaker,
      do not use their name, and do not use pronouns for them. Never write meta-openers such as "This
      analysis", "This summary", "This talk" or "The presentation", and never add a closing paragraph
      that starts with "In summary", "Overall" or "In conclusion". Start directly with the subject.
      No hype, no marketing language, no second person.

      Cover the problem addressed, the approach taken, and the key takeaways.
      Write approximately {max_words} words as plain prose in two to four paragraphs.
      Do not use Markdown, headings, bullet points or lists. Complete every sentence and end with a
      proper closing sentence — never stop mid-thought.

  # OpenAI
  openai:
    api_key: ""
    # Models: gpt-4, gpt-4-turbo, gpt-3.5-turbo, gpt-4o, gpt-4o-mini
    model: "gpt-4-turbo"
    organization: ""   # optional
    temperature:
      teaser: 0.7
      description: 0.9

  # Anthropic Claude
  anthropic:
    api_key: ""
    # Models: claude-sonnet-5, claude-3-5-sonnet-20241022, claude-3-opus-20240229
    model: "claude-sonnet-5"
    max_tokens: 2000
    temperature:
      teaser: 0.7
      description: 0.3   # lower = more focused, concise summaries

  # Claude Code CLI in print mode: uses the machine's Claude subscription instead
  # of API credits. The CLI exposes neither max_tokens nor temperature, so output
  # length is governed by the prompt alone.
  claude_code:
    binary: "claude"
    model: "sonnet"
    timeout: 600

  # Local MLX model via an OpenAI-compatible server (e.g. omlx-server).
  # Keeps all transcript data on-device. Set `model` to a served model id and
  # `api_key` to whatever the local server requires.
  mlx:
    base_url: "http://127.0.0.1:8000/v1"
    api_key: ""
    model: ""
    max_tokens: 2000
    temperature:
      teaser: 0.7
      description: 0.3



