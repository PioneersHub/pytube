[tox]
# Test against Python versions supported by the project
envlist = py{311,312,313},lint,type,docs
isolated_build = true
skip_missing_interpreters = true

[testenv]
# Base test environment configuration
description = Run unit tests with pytest
deps = 
    pytest>=8.0
    pytest-cov>=4.0
    pytest-mock>=3.0
    pytest-timeout>=2.0
    pytest-asyncio>=0.21
    httpx>=0.25
extras = 
    all
commands = 
    pytest {posargs:tests}

[testenv:integration]
# Integration tests - run separately as they're slower
description = Run integration tests
commands = 
    pytest {posargs:tests/test_integration -m integration}

[testenv:slow]
# Run all tests including slow ones
description = Run all tests including slow ones
commands = 
    pytest {posargs:tests}

[testenv:fast]
# Run only fast unit tests
description = Run fast unit tests only
commands = 
    pytest {posargs:tests -m "not slow and not integration"}

[testenv:lint]
# Code quality checks
description = Run code quality checks with ruff
skip_install = true
deps = 
    ruff>=0.1.0
commands = 
    ruff check src tests
    ruff format --check src tests

[testenv:format]
# Auto-format code
description = Auto-format code with ruff
skip_install = true
deps = 
    ruff>=0.1.0
commands = 
    ruff check --fix src tests
    ruff format src tests

[testenv:type]
# Type checking
description = Run type checking with mypy
deps = 
    mypy>=1.0
    types-requests
    types-pyyaml
extras = 
    all
commands = 
    mypy src

[testenv:docs]
# Documentation building
description = Build documentation with mkdocs
deps = 
    mkdocs>=1.5
    mkdocstrings[python]>=0.24
    mkdocs-material>=9.0
extras = 
    docs
commands = 
    mkdocs build

[testenv:coverage]
# Generate coverage report
description = Generate detailed coverage report
deps = 
    {[testenv]deps}
    coverage[toml]>=7.0
commands = 
    coverage run -m pytest tests
    coverage report
    coverage html
    coverage xml

[testenv:dev]
# Development environment with all tools
description = Development environment with all testing tools
deps = 
    {[testenv]deps}
    {[testenv:lint]deps}
    {[testenv:type]deps}
    ipython>=8.0
    ipdb>=0.13
extras = 
    all
    dev
commands = 
    python -c "print('Development environment ready!')"

# Test environment settings
[pytest]
testpaths = tests

[coverage:run]
source = src
omit = */tests/*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false

[flake8]
# If you want to use flake8 instead of ruff
max-line-length = 88
extend-ignore = E203, W503
exclude = 
    .git,
    __pycache__,
    .tox,
    .eggs,
    *.egg,
    build,
    dist