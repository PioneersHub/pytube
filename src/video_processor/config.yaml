# Input settings
input:
  # Single video file path (leave empty to use folder)
  video_path: ""
  # Folder containing videos to batch process (leave empty to use video_path)
  folder: "/Users/hendorf/code/pioneershub/py_tube/_data/videos/input"
  # File extensions to process from input folder (comma-separated)
  extensions: "mp4,mkv,avi,mov,webm"
  # Filenammping mapping from Parquet
  mapping_file: "/Users/hendorf/code/pioneershub/py_tube/_data/videos/pyconde-pydata-2025_sessions_processed.parquet"


# Video processing settings
video:
  # Whether to resize frames for processing (speeds up detection but reduces accuracy)
  enable_resize: false
  # If resize is enabled, dimensions to use (width, height)
  processing_size: [320, 180]

# Break screen detection settings
break_detection:
  # Directory for break screen images (leave empty for auto-detection)
  images_dir: "/Users/hendorf/code/pioneershub/py_tube/_data/break_slides"
  # Similarity threshold for break screen detection (0-1)
  threshold: 0.95
  # Comparison method: "template" or "histogram"
  comparison_method: "template"
  # Whether to auto-detect break screens if none provided
  auto_detect: true
  # Directory to save detected break screens
  detected_screens_dir: "/Users/hendorf/code/pioneershub/py_tube/_data/break_screens_detected"

# Presentation detection settings
presentation_detection:
  # Minimum precision interval in seconds for binary search
  min_interval: 2
  # Size of initial search chunks in seconds (default 5 minutes)
  chunk_size: 300
  # Sampling interval for break screen detection in seconds
  sampling_interval: 30
  # Maximum number of samples to take for break screen detection
  max_samples: 200
  # Clustering threshold for break screen detection (0-1)
  cluster_threshold: 0.90

# Output settings
output:
  # Base output folder for extracted presentations
  folder: "/Users/hendorf/code/pioneershub/py_tube/_data/videos/output"
  # Whether to make a processing plan: detect presentations in video and save to JSON
  make_processing_plan: true
  # Whether to extract detected presentations as separate files
  extract_presentations: false
  # Whether to extract audio from presentations as MP3
  extract_audio: true
  # Whether to save presentation metadata as JSON
  save_metadata: true

# Event info like lunch break
event:
  # 24 hrs format. Session before will be mapped to Morning, after to Afternoon
  lunch_break_cut: 13

# Vimeo Downloader Configuration
search:
  query: "PyCon"
  pattern: "2025"
  max_videos: 25

save_to:
  directory: "/Users/hendorf/code/pioneershub/py_tube/_data/videos/input"