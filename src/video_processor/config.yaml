# Input settings
input:
  # Single video file path (leave empty to use folder)
  video_path: ""
  # Folder containing videos to batch process (leave empty to use video_path)
  folder: "/Volumes/DATA4T/vimeo-downloads/"
  # File extensions to process from input folder (comma-separated)
  extensions: "mp4,mkv,avi,mov,webm"
  # File mapping from Parquet — must be the Stage 2 output next to pretalx.sessions_csv:
  # same directory, name {sessions_csv_stem}_processed.parquet (see process_talk_list.py).
  mapping_file: "/Volumes/DATA4T/2026/pyconde-pydata-2026_sessions_processed.parquet"
  # When true, Parquet is not loaded (use with: python presentation_detector.py --probe-video ... --probe-skip-mapping)
  allow_missing_mapping: false


# Video processing settings
video:
  # Whether to resize frames for processing (speeds up detection but reduces accuracy)
  enable_resize: false
  # If resize is enabled, dimensions to use (width, height)
  processing_size: [320, 180]
  # Resize frames/refs for break comparison (template/histogram); strongly recommended for speed
  detection_resize: true
  # Size used when detection_resize is true (width, height). Larger = better match, slower (e.g. 640x360).
  detection_size: [640, 360]
  # If true, seek with CAP_PROP_POS_MSEC instead of frame index (backend-dependent; try if seeks are slow)
  seek_use_pos_msec: false

# Break screen detection settings
break_detection:
  # Directory for break screen images (leave empty for auto-detection)
  images_dir: "/Volumes/DATA4T/2026/break_slides"
  # Similarity threshold (0-1). Template scores on resized frames are often 0.15-0.45 for talks;
  # full-screen break graphics often peak higher. Run: --probe-video PATH --probe-every 300
  # Raise threshold if you get false breaks; lower if you get 0 presentations (try histogram too).
  threshold: 0.38
  # Comparison method: "template" or "histogram"
  comparison_method: "template"
  # Whether to auto-detect break screens if none provided
  auto_detect: true
  # Directory to save detected break screens
  detected_screens_dir: "/Volumes/DATA4T/2026/break_slides/break_screens_detected"
  # If true, only load PNGs whose filename contains the room matched from the video path (plus shared slides)
  filter_refs_by_room: true
  # Filenames containing any of these substrings are always kept (multi-room / pre-session graphics)
  shared_ref_substrings:
    - "All-Rooms"
    - "Pre-Session-Graphic-All-Rooms"
  # Optional fallback room list when mapping Parquet has no Room column (longest match wins in filename)
  room_names: []
  # PyConDE-26-style slides use prefixes like Welcome-, Talk-Starting-, Logo-, Lunch-, End-Stream-{Room}-.
  # Shared: Pre-Session-Graphic-All-Rooms-*.png (see shared_ref_substrings).
  # Filenames containing any of these substrings are used ONLY to detect the *end* of a talk
  # (presentation → break). Other loaded images are used for break→presentation and generic break.
  end_ref_substrings:
    - "End-Stream"

# Presentation detection settings
presentation_detection:
  # Minimum precision interval in seconds for binary search
  min_interval: 2
  # Size of initial search chunks in seconds (default 5 minutes)
  chunk_size: 300
  # Max step (seconds) when galloping; must be > chunk_size or exponential search collapses to fixed steps
  gallop_max_step: 3600
  # Seconds after presentation start before searching for presentation→break (avoid instant false end)
  end_search_after_start_sec: 300
  # Use each plan row's Pretalx ``Duration`` to bound End-Stream search (asymmetric slack by slot).
  use_schedule_duration_for_end_search: true
  # Optional override of default late/early slack (minutes) per standard slot. Values: [late, early].
  # Defaults: 30→[5,10], 45→[5,15], 60→[10,15], 90→[10,15].
  # schedule_slack_by_slot_min:
  #   30: [5, 10]
  #   45: [5, 15]
  #   60: [10, 15]
  #   90: [10, 15]
  # If the detector returns a talk longer than this (minutes), re-scan from talk start for the first
  # End-Stream (end_break) transition within this window — recovers missed cuts between back-to-back talks.
  max_presentation_duration_min: 90
  # Grid step when re-scanning an oversized segment (seconds); smaller = finer, slower.
  oversized_segment_scan_step_sec: 120
  # Sampling interval for break screen detection in seconds
  sampling_interval: 30
  # Maximum number of samples to take for break screen detection
  max_samples: 200
  # Clustering threshold for break screen detection (0-1)
  cluster_threshold: 0.90
  # If non-empty, log a warning when a detected segment length (minutes) is farther than
  # duration_validation_tolerance_min from every listed slot (typical talk lengths).
  # Does not change cut points — validation only.
  expected_talk_lengths_min: [30, 45, 60, 90]
  duration_validation_tolerance_min: 7
  # Hard gates before any FFmpeg extract (see detection_quality in processing_plan.yaml).
  detection_quality:
    enabled: true
    # Fail when len(detected segments) != len(scheduled session rows).
    fail_on_count_mismatch: true
    # Reject any single segment longer than this (minutes). Prevents bogus multi-hour "one talk" merges.
    max_segment_duration_min: 120
    # When multiple sessions are scheduled but only one segment is found, fail if it covers more than
    # this fraction of the file (missed End-Stream between talks).
    fail_single_segment_max_video_fraction: 0.72

# Output settings
output:
  # Base output folder for extracted presentations
  folder: "/Volumes/DATA4T/2026/output"
  # When true, runs detection WITHOUT extracting clips — writes
  # processing_plan.yaml with detection_quality. Review before cutting.
  make_processing_plan: false
  # If false (recommended), `extract_presentations` does NOT auto-run detection when the plan
  # lacks timings — run `presentation_detector.py --detect-only`, then `--extract-only`.
  auto_detect_on_extract: false
  # Whether to extract detected presentations as separate files (FFmpeg; requires valid plan).
  extract_presentations: true
  # Whether to extract audio from presentations as MP3
  extract_audio: true
  # Whether to save presentation metadata as JSON
  save_metadata: true
  # If true, FFmpeg uses -ss before -i for faster stream-copy (less frame-accurate than -ss after -i)
  fast_input_seek: false

# Event info like lunch break
event:
  # 24 hrs format. Session before will be mapped to Morning, after to Afternoon
  lunch_break_cut: 13
