# Input settings
input:
  # Single video file path (leave empty to use folder)
  video_path: ""
  # Folder containing videos to batch process (leave empty to use video_path)
  folder: "/Volumes/DATA4T/vimeo-downloads/"
  # File extensions to process from input folder (comma-separated)
  extensions: "mp4,mkv,avi,mov,webm"
  # Session mapping YAML — Stage 2 output next to pretalx.sessions_csv.
  # Expected top-level shape: {sessions: [ {ID, Proposal title, Room, Day, TimePeriod, Recording, ...}, ... ]}
  mapping_file: "/Volumes/DATA4T/2026/pyconde-pydata-2026_sessions_processed.yaml"
  # When true, mapping YAML is not loaded (use with: python presentation_detector.py --probe-video ... --probe-skip-mapping)
  allow_missing_mapping: false


# Video processing settings
video:
  # Whether to resize frames for processing (speeds up detection but reduces accuracy)
  enable_resize: false
  # If resize is enabled, dimensions to use (width, height)
  processing_size: [320, 180]
  # Resize frames/refs for break comparison (template/histogram); strongly recommended for speed
  detection_resize: true
  # Size used when detection_resize is true (width, height). Larger = better match, slower (e.g. 640x360).
  detection_size: [640, 360]
  # If true, seek with CAP_PROP_POS_MSEC instead of frame index (backend-dependent; try if seeks are slow)
  seek_use_pos_msec: false

# Break screen detection settings
break_detection:
  # Directory for break screen images (leave empty for auto-detection)
  images_dir: "/Volumes/DATA4T/2026/break_slides"
  # Similarity threshold (0-1). Template scores on resized frames are often 0.15-0.45 for talks;
  # full-screen break graphics often peak higher. Run: --probe-video PATH --probe-every 300
  # Raise threshold if you get false breaks; lower if you get 0 presentations (try histogram too).
  presentation_starts_soon_images: "/Volumes/DATA4T/2026/presentation_starts_soon_images"
  # Shared sponsor-thanks / cycling-graphic slides — loaded room-filter-skipped alongside
  # presentation_starts_soon_images. Leave empty if none.
  sponsor_slides: "/Volumes/DATA4T/2026/sponsor_slides"
  threshold: 0.38
  # Comparison method: "template" | "histogram" | "phash" | "clip" | "phash_clip".
  # - "template"/"histogram": existing OpenCV methods; use ``threshold`` above.
  # - "phash": fast perceptual hash (Hamming distance ≤ phash.max_hamming_distance).
  # - "clip": CLIP image-embedding cosine ≥ clip.cosine_threshold (robust to compression/overlays).
  # - "phash_clip": pHash shortlist → CLIP confirmation (recommended for streams with artifacts).
  comparison_method: "template"
  # Tuning for ``comparison_method: phash`` and the shortlist step of ``phash_clip``.
  phash:
    # Hash bit length is 64 (cv2.img_hash.PHash). Accept match when Hamming distance ≤ this.
    max_hamming_distance: 8
    # Extra slack added to max_hamming_distance when building the pHash→CLIP shortlist (phash_clip only).
    shortlist_margin: 4
  # Tuning for ``comparison_method: clip`` and the confirmation step of ``phash_clip``.
  clip:
    # open_clip model name (any architecture supported by open_clip.create_model_and_transforms).
    model: "ViT-B-32"
    pretrained: "laion2b_s34b_b79k"
    # Start around 0.85–0.95; calibrate against known-good video.
    cosine_threshold: 0.88
    # "auto" picks cuda → mps → cpu. Override to "cpu" to avoid GPU init cost.
    device: "auto"
  # Temporal consistency — require ``min_agree`` of ``window_frames`` nearby samples to classify as break.
  # Applied by detection loops that call ``_is_break_with_temporal``; ``min_agree <= 1`` disables it.
  temporal:
    window_frames: 3
    min_agree: 2
    # Spacing between the N samples in the window (seconds).
    step_sec: 0.5
  # Tuning for ``--inverse-detect``: 3-pass algorithm (coarse pHash → persistence → local refine).
  # Presumes breaks persist ≥ ``min_break_sec``; raw noise is rejected by ``min_block_samples``.
  inverse:
    # Pass 1 — coarse scan rate. 5s ≈ 60 samples per 5-minute break → plenty of evidence.
    coarse_step_sec: 5.0
    # Pass 3 — boundary refinement (samples at this step inside ±refine_pad_sec of each break block).
    refine_step_sec: 1.0
    refine_pad_sec: 30.0
    # Pass 2 — persistence: same ref must match in ≥ min_block_samples consecutive coarse samples.
    # With coarse_step_sec=5.0, min_block_samples=4 ⇒ 20s continuous evidence.
    min_block_samples: 4
    # Pass 2 — merge adjacent blocks of the same ref if the gap between them is ≤ merge_gap_sec
    # (tolerates fades, transition cuts, single missed sample).
    merge_gap_sec: 15.0
    # Reject any confirmed break block shorter than this; breaks in this event are ≥ 5 min.
    min_break_sec: 300.0
    # Template-match (TM_CCOEFF_NORMED) threshold vs every loaded break ref. A frame is a
    # break frame when its best score against any ref is ≥ this. Looser than the main pipeline's
    # ``break_detection.threshold`` (0.38) because break slides in the wild carry overlays
    # (countdown timer, sponsor bar, schedule ticker) that drop the score a bit.
    match_threshold: 0.30
  # Whether to auto-detect break screens if none provided
  auto_detect: true
  # Directory to save detected break screens
  detected_screens_dir: "/Volumes/DATA4T/2026/break_slides/break_screens_detected"
  # If true, only load PNGs whose filename contains the room matched from the video path (plus shared slides)
  filter_refs_by_room: true
  # Filenames containing any of these substrings are always kept (multi-room / pre-session graphics)
  shared_ref_substrings:
    - "All-Rooms"
    - "Pre-Session-Graphic-All-Rooms"
  # Session *start*: match Pre-Session-Graphic until it is no longer on screen → that edge is talk start.
  # Substrings match filenames (e.g. ``Pre-Session-Graphic-All-Rooms-PyConDE-26.png`` matches
  # ``Pre-Session-Graphic-All-Rooms``). You do not list the full filename here.
  # Default when key omitted: ["Pre-Session-Graphic-All-Rooms"]. Set to [] to use all refs for talk start (legacy).
  start_ref_substrings:
    - "Pre-Session-Graphic-All-Rooms"
  # Optional: absolute path, or filename relative to ``images_dir``, to ONE PNG used only for session-start
  # (``start_break``). Talk begins when this slide stops matching — overrides ``start_ref_substrings`` when set
  # and the file loads. Example: Pre-Session-Graphic-All-Rooms-PyConDE-26.png
  start_image: ""
  # Optional: stricter/softer threshold for Pre-Session (if End-Stream needs different sensitivity, use end_threshold).
  # start_threshold: 0.35
  # Lower end_threshold (e.g. 0.28–0.32) if End-Stream slides match weakly vs the PNG on real video.
  # end_threshold: 0.30
  # Optional fallback room list when mapping YAML has no Room column (longest match wins in filename)
  room_names: []
  # PyConDE-26-style slides use prefixes like Welcome-, Talk-Starting-, Logo-, Lunch-, End-Stream-{Room}-.
  # Filenames containing any of these substrings are used ONLY for presentation→break (room End-Stream, etc.).
  end_ref_substrings:
    - "End-Stream"

# Presentation detection settings
presentation_detection:
  # Minimum precision interval in seconds for binary search
  min_interval: 2
  # Size of initial search chunks in seconds (default 5 minutes)
  chunk_size: 300
  # Max step (seconds) when galloping; must be > chunk_size or exponential search collapses to fixed steps
  gallop_max_step: 3600
  # Seconds after presentation start before searching for presentation→break (avoid instant false end)
  end_search_after_start_sec: 300
  # When true: enumerate all Pre-Session→talk edges first, then find End-Stream only within each
  # session window (until next start or EOF). When false: legacy iterative find_next_presentation loop.
  two_phase_detection: true
  # If no presentation→End-Stream edge is found before EOF, treat the remainder as one talk (continuous
  # recording or missing End-Stream refs). Set false to fail when no edge is detected.
  fallback_segment_if_no_end_stream: true
  # Use each plan row's Pretalx ``Duration`` to bound End-Stream search (asymmetric slack by slot).
  use_schedule_duration_for_end_search: true
  # After each Pre-Session→talk edge at time t, resume scanning for the next edge at t + that row's
  # ``Duration`` (faster than stepping across whole talks). Used only when multiple schedule rows;
  # disabled for a single row so one early false edge cannot skip the real Pre-Session band.
  use_schedule_duration_for_presession_scan: true
  # Optional override of default late/early slack (minutes) per standard slot. Values: [late, early].
  # Defaults: 30→[5,10], 45→[5,15], 60→[10,15], 90→[10,15].
  # schedule_slack_by_slot_min:
  #   30: [5, 10]
  #   45: [5, 15]
  #   60: [10, 15]
  #   90: [10, 15]
  # If the detector returns a talk longer than this (minutes), re-scan from talk start for the first
  # End-Stream (end_break) transition within this window — recovers missed cuts between back-to-back talks.
  max_presentation_duration_min: 90
  # Grid step when re-scanning an oversized segment (seconds); smaller = finer, slower.
  oversized_segment_scan_step_sec: 45
  # Subtracted from end_break threshold on successive passes (0 = strict first). Use when End-Stream
  # matches weakly on the real video.
  oversized_end_break_relax_deltas: [0.0, 0.06, 0.1, 0.14]
  # If End-Stream never matches on the file but the schedule has multiple rows, end talk 1 at the next
  # Pre-Session→talk edge (same ``start_break`` as openings). Dense step avoids missing short slides.
  oversized_use_presession_talk_boundary: true
  presession_boundary_scan_step_sec: 5
  # Sampling interval for break screen detection in seconds
  sampling_interval: 30
  # Maximum number of samples to take for break screen detection
  max_samples: 200
  # Clustering threshold for break screen detection (0-1)
  cluster_threshold: 0.90
  # If non-empty, log a warning when a detected segment length (minutes) is farther than
  # duration_validation_tolerance_min from every listed slot (typical talk lengths).
  # Does not change cut points — validation only.
  expected_talk_lengths_min: [30, 45, 60, 90]
  duration_validation_tolerance_min: 7
  # Hard gates before any FFmpeg extract (see detection_quality + session_report in processing_plan.yaml).
  # When the gate fails, logs and YAML include failure_codes:
  #   count_mismatch — detector produced a different number of (start,end) segments than scheduled rows
  #     (almost always: missed End-Stream cuts between talks, or wrong mapping row count).
  #   max_segment_duration — one segment longer than max_segment_duration_min (merged talks / no cut).
  #   single_segment_covers_file — multiple sessions scheduled but only one segment covering most of the file.
  # Fix detection first (break_detection.threshold, End-Stream PNGs, comparison_method, room filter); do not
  # disable quality to "pass" bad cuts. Set fail_on_count_mismatch: false only for experiments.
  detection_quality:
    enabled: true
    # Fail when len(detected segments) != len(scheduled session rows).
    fail_on_count_mismatch: true
    # Reject any single segment longer than this (minutes). Prevents bogus multi-hour "one talk" merges.
    max_segment_duration_min: 120
    # When multiple sessions are scheduled but only one segment is found, fail if it covers more than
    # this fraction of the file (missed End-Stream between talks).
    fail_single_segment_max_video_fraction: 0.72

# Output settings
output:
  # Base output folder for extracted presentations
  folder: "/Users/hendorf/Downloads/reupload"
  # When true, runs detection WITHOUT extracting clips — writes
  # processing_plan.yaml with detection_quality. Review before cutting.
  make_processing_plan: false
  # If false (recommended), `extract_presentations` does NOT auto-run detection when the plan
  # lacks timings — run `presentation_detector.py --detect-only`, then `--extract-only`.
  auto_detect_on_extract: false
  # Whether to extract detected presentations as separate files (FFmpeg; requires valid plan).
  extract_presentations: true
  # Extract an audio companion for each MP4 video clip. Default false — MP4-only
  # output is the normal case; flip to true when you also need audio-only files.
  extract_audio: false
  # Audio format when extract_audio is true. One of: m4a (default), mp3, wav.
  audio_format: m4a
  # Whether to save presentation metadata as JSON
  save_metadata: true
  # If true, FFmpeg uses -ss before -i for faster stream-copy (less frame-accurate than -ss after -i)
  fast_input_seek: false
  # save cut session here
  upload_folder: "/Users/hendorf/Downloads/reupload"


# Event info like lunch break
event:
  # 24 hrs format. Session before will be mapped to Morning, after to Afternoon
  lunch_break_cut: 13
